name: archive referee rooms

# technocore.chat keeps a room only 7 days after its last write and rooms are rings, so the referee's
# signed record would vanish after the contest. This keeps byte-exact copies of the five referee rooms'
# exports (each line re-verifiable on its own) on the `archive` branch, once a day and on demand.
on:
  schedule:
    - cron: "5 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch and verify the exports
        run: |
          mkdir -p out
          for room in d-close1-price d-close1-flow d-close1-positions d-close1-pnl d-close1-state; do
            curl -sfS --retry 3 "https://technocore.chat/r/$room/export" -o "out/$room.jsonl"
            echo "$room: $(wc -l < out/$room.jsonl) lines, $(wc -c < out/$room.jsonl) bytes"
          done
          node --input-type=module -e '
            import { readFile } from "node:fs/promises";
            import { makeVerifier, checkRecord } from "./verify.js";
            const DID = "did:key:z6MkowHQwsx9xr84WbWN3YCnKutyBnBXkT1ChKY4uEAAMzte";
            const v = await makeVerifier(DID);
            let ok = 0, bad = 0;
            for (const room of ["d-close1-price","d-close1-flow","d-close1-positions","d-close1-pnl","d-close1-state"]) {
              for (const line of (await readFile(`out/${room}.jsonl`, "utf8")).split("\n")) {
                if (!line.trim()) continue;
                const r = await checkRecord(v, DID, room, line, JSON.parse(line));
                r.ok ? ok++ : bad++;
              }
            }
            console.log(`verified ${ok}, not from the referee or bad signature ${bad}`);
            if (ok === 0) process.exit(1);
          '
          cp README.md out/README-main.md
          date -u +%FT%TZ > out/ARCHIVED_AT
      - name: Commit to the archive branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin archive || true
          if git rev-parse --verify origin/archive >/dev/null 2>&1; then
            git checkout -B archive origin/archive
          else
            git checkout --orphan archive && git rm -rfq . || true
          fi
          mkdir -p referee-rooms
          cp out/*.jsonl referee-rooms/
          cp out/ARCHIVED_AT referee-rooms/ARCHIVED_AT
          printf '# close-1 referee rooms, byte-exact exports\n\nEach line is one technocore.chat record: `{"seq","ts","from","text","nonce","sig"}`.\nVerify a line alone: Ed25519 over `<room>|<nonce>|<text>` with the referee did:key\n`did:key:z6MkowHQwsx9xr84WbWN3YCnKutyBnBXkT1ChKY4uEAAMzte` (see verify.js on main). Keep the nonce as raw digits.\n\nArchived at: %s\n' "$(cat out/ARCHIVED_AT)" > referee-rooms/README.md
          git add referee-rooms
          git -c commit.gpgsign=false commit -qm "archive: referee rooms at $(cat out/ARCHIVED_AT)" || echo "nothing changed"
          git push origin archive
